version: '3.8'

services:
  # ============================================================================
  # ArchitectIQ Backend (FastAPI + Simulation & Optimization Engines)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: architectiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - AI_PROVIDER=${AI_PROVIDER:-huggingface}
      - ALLOW_AI_FALLBACK=${ALLOW_AI_FALLBACK:-true}
      - VISION_AI_PROVIDER=${VISION_AI_PROVIDER:-gemini}
      - TEXT_AI_PROVIDER=${TEXT_AI_PROVIDER:-huggingface}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-google/gemma-2-27b-it}
      - HF_BASE_URL=${HF_BASE_URL:-https://router.huggingface.co/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL_ID=${GEMINI_MODEL_ID:-gemini-flash-latest}
      - USE_MOCK_SIMULATOR=${USE_MOCK_SIMULATOR:-false}
      - SIMULATOR_TIMEOUT_SECONDS=${SIMULATOR_TIMEOUT_SECONDS:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - architectiq-net

  # ============================================================================
  # ArchitectIQ Frontend (Vite Compiled SPA + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: architectiq-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - architectiq-net

  # ============================================================================
  # Prometheus Monitoring Service
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: architectiq-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - architectiq-net

  # ============================================================================
  # Grafana Dashboard & Visualization Service
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: architectiq-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - architectiq-net

networks:
  architectiq-net:
    driver: bridge
    name: architectiq-network

volumes:
  prometheus-data:
    name: architectiq-prometheus-data
  grafana-data:
    name: architectiq-grafana-data

