services:
  # ============================================================================
  # SonarQube Code Quality & Security Analysis Server
  # Independent security service — decoupled from application startup
  # Resource Requirement: ~2.5GB RAM minimum (Elasticsearch requirement)
  # ============================================================================
  sonarqube:
    image: sonarqube:10.5-community
    container_name: architectiq-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Dnode.store.allow_mmap=false
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - architectiq-net

networks:
  architectiq-net:
    name: architectiq-network
    external: true

volumes:
  sonarqube-data:
    name: architectiq-sonarqube-data
  sonarqube-extensions:
    name: architectiq-sonarqube-extensions
  sonarqube-logs:
    name: architectiq-sonarqube-logs

