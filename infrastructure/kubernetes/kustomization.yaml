apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: architectiq

resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

images:
  - name: architectiq/backend
    newName: architectiq/backend
    newTag: v1.0.0
  - name: architectiq/frontend
    newName: architectiq/frontend
    newTag: v1.0.0

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: architectiq

