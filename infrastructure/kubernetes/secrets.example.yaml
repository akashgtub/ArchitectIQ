# Example Secrets Template for ArchitectIQ
# In production, create using:
# kubectl create secret generic architectiq-secrets \
#   --namespace=architectiq \
#   --from-literal=GEMINI_API_KEY="your-gemini-key" \
#   --from-literal=HF_TOKEN="your-hf-token" \
#   --from-literal=GEMMA_API_KEY=""
apiVersion: v1
kind: Secret
metadata:
  name: architectiq-secrets
  namespace: architectiq
  labels:
    app.kubernetes.io/name: architectiq
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  GEMINI_API_KEY: "CHANGE_ME_GEMINI_KEY"
  HF_TOKEN: "CHANGE_ME_HF_TOKEN"
  GEMMA_API_KEY: ""
  GEMMA_BASE_URL: ""
  SIMULATOR_BASE_URL: ""

