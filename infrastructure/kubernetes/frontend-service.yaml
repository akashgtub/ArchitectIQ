apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: architectiq
  labels:
    app.kubernetes.io/name: architectiq-frontend
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: architectiq-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
      protocol: TCP

