apiVersion: apps/v1
kind: Deployment
metadata:
  name: architectiq-frontend
  namespace: architectiq
  labels:
    app.kubernetes.io/name: architectiq-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: architectiq-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: architectiq-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: architectiq-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: architectiq/frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-frontend
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-frontend
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-frontend
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false

