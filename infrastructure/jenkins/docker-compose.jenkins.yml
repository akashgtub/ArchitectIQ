services:
  # ============================================================================
  # Jenkins CI/CD Controller Service
  # ============================================================================
  jenkins:
    image: devopsforge-jenkins-docker:local
    container_name: devopsforge-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - devopsforge_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - architectiq-net

networks:
  architectiq-net:
    name: architectiq-network
    external: true

volumes:
  devopsforge_jenkins_home:
    name: devopsforge_jenkins_home
    external: true
