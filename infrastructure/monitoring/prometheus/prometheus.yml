global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ArchitectIQ Backend Service
  - job_name: 'architectiq-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  # ArchitectIQ Frontend Nginx Service
  - job_name: 'architectiq-frontend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['frontend:80']
