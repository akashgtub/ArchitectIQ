---
# Role: app_configuration
# Prepares environment variables and configuration files for ArchitectIQ services

- name: Announce configuration generation
  ansible.builtin.debug:
    msg: "Configuring application variables for environment '{{ environment_name }}'"

- name: Generate deployment environment configuration file
  ansible.builtin.copy:
    dest: /etc/architectiq/architectiq.env
    mode: '0600'
    content: |
      # Auto-generated by Ansible for ArchitectIQ
      ENVIRONMENT={{ environment_name }}
      PORT={{ backend_port }}
      AI_PROVIDER={{ ai_provider }}
      ALLOW_AI_FALLBACK={{ allow_ai_fallback }}
      VISION_AI_PROVIDER={{ vision_ai_provider }}
      TEXT_AI_PROVIDER={{ text_ai_provider }}
      USE_MOCK_SIMULATOR={{ use_mock_simulator }}
  when: ansible_os_family != "Windows"

