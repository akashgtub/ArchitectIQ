# ============================================================================
# ArchitectIQ - SonarQube Project Analysis Configuration
# ============================================================================

sonar.projectKey=ArchitectIQ
sonar.projectName=ArchitectIQ
sonar.projectVersion=1.0.0

# Source & Test Code Base
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/test

# Source Encoding
sonar.sourceEncoding=UTF-8

# Python Analysis
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript Analysis
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/reports/**,**/docs/**,**/*.json,**/*.yaml,**/*.yml,**/*.md,**/test*/**,**/__pycache__/**
sonar.test.inclusions=backend/tests/**,frontend/test/**

# SonarQube Server URL Default
sonar.host.url=http://localhost:9000

